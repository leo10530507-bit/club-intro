<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>我賭你看不到這行字</title>
        <link rel="stylesheet" type="text/css" href="css.css" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Jersey+10&family=Orbitron:wght@400..900&family=Oxanium:wght@200..800&family=Pixelify+Sans&display=swap');
                body{
                    background-color:#050807;
                    color:white;
                    font-family:"Orbitron",sans-serif;
                }
                header{
                    background-color:rgba(10,18,14,0.96)!important;
                    border-bottom:1px solid #56dc4a !important;
                    box-shadow: 0 0 20px rgba(86,220,74,0.25);
                }
                #input label {
                    font-family: "Orbitron", sans-serif !important;
                    font-size: 20px !important;
                    color: #030353 !important;
                }
                #info {
                    font-family: "Oxanium", sans-serif !important;
                    font-size: 30px !important;
                    color: #f3f3f7 !important;
                }

        </style>
        
        
    </head>
    
<body>
    <header style="
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding-top: 12px;
        padding-bottom: 12px;
        z-index: 1000;
        background-color: rgb(7, 7, 7);
        border-bottom: 1px solid gray;
        
        "
        
        >
        <div style="padding-left: 120px;width:50% ">
            <div class="header"style="text-shadow: 0 0 20px chartreuse;font-family:Orbitron, sans-serif;">
                <span style="color:chartreuse">Print</span><span style="color:chartreuse">(</span><span style="color: chartreuse;">"CYGSH_IRC_13th"</span><span style="color:chartreuse">)</span>
            </div>
        </div>
        <div style="display: flex;justify-content: flex-end;align-items: center;width:50%;padding-right: 50px;">
            <div class="intro">首頁</div>
            <div class="intro">課程規劃</div>
            <div class="intro">CTF體驗</div>
        </div>
    </header> 
    <div style="justify-items: center;">
        <div id="suc" style="display: none;font-size: 20px;color: white;margin-top: 350px">
            透過Unicode和XOR的方式加密flag,再透過呼叫設定好的函式來解密
        </div>
        <div id="tips" style="color: white;margin-top: 350px;font-size: 20px;">
            檢查開發人員介面後發現flag被加密了,在JavaScript裡找找看有沒有解密的函式
            <br>
            <div style="margin-left: 200px;">
            並在Console裡執行看看吧！
            </div>
        </div>
        
        <div id="column" class="CTF2chunck" style="margin-top: 20px;">
                    <div style="margin-top: 10px;display: flex;" >
                        <input id="flag" placeholder="Flag{...}" style="font-size: 20px;border:1px solid black">
                        <div onclick="ans();" style="margin-left: 20px;background-color: chartreuse;padding-left: 15px;padding-right: 15px;border-radius: 10px;padding-top:5px;padding-bottom: 5px;cursor: pointer;" onmouseover="over(this)" onmouseout="out(this)" onmousedown="down(this)"
                onmouseup="up(this)">提交</div>
                    </div>
        </div>
        <div id="flagAlarm" style="color:rgb(255, 0, 0);margin-top:15px;display: none;">Flag錯誤,請再試一次</div>
    </div>
    <script>
        function ans(){
            const suc=document.getElementById("suc")
            const weee=document.getElementById("column")
            const tip=document.getElementById("tips")
            const flag=document.getElementById("flag")
            const flagAlarm=document.getElementById("flagAlarm")
            const result=flag.value

            if(result=="flag{1_d0Nt_kn0vv}"){
                
                suc.style.display="block"
                weee.style.marginTop="49px"
                tip.style.display="none"
                console.log("success")
                setTimeout(()=>{
                window.location.replace("finish.html")
                console.log("success")
                }, 2000)
            }else{
                
                flagAlarm.style.display="block"
                setTimeout(()=>{
                flagAlarm.style.display="none"
                },1200)
            }
        }
        const encrypted = [
    113, 123, 118, 112, 108, 38, 72, 115, 39,
    89, 99, 72, 124, 121, 39, 97, 97, 106
    ];

    function getSecret() {
      const key = 23;
      return encrypted.map(n => String.fromCharCode(n ^ key)).join("");
    }

    function checkFlag() {
      const input = document.getElementById("flag").value;
      const result = document.getElementById("result");

      result.textContent =
        input === getSecret() ? "✅ Correct! Flag accepted." : "❌ Wrong flag.";
    }

        function over(event){
                event.style.backgroundColor="#63ab1b"

            }
            function out(event){
                event.style.backgroundColor="#7fff00"
            }
            function down(event){
                event.style.fontWeight="bold"
                
            }
            function up(event){
                event.style.fontWeight="normal"
            }
    </script>

    
</body>
</html>
